<title>Flipbook</title>
<meta name="claude:viewport-fit-sides" content="cover">

<style>
/* Layout: one-column phone app, sticky header, content stack, fixed bottom tab bar. Single dark look. */
:root{
  --bg:#09080c; --surface:#131119; --raise:#1b1824; --line:#2a2535; --line2:#3a3349;
  --fg:#eeebf4; --dim:#9a93aa; --faint:#645d73;
  --accent:#8b5cf6; --accent2:#b79bff;
  --pos:#3ddc97; --neg:#ff6b81; --blue:#5aa9ff; --warn:#f5b84b;
  --display:"Bricolage Grotesque",ui-sans-serif,system-ui,sans-serif;
  --body:"Instrument Sans",ui-sans-serif,system-ui,-apple-system,sans-serif;
  --mono:"Geist Mono",ui-monospace,"SF Mono",Menlo,monospace;
  --r:14px; --ease:cubic-bezier(.2,.8,.2,1); --spring:cubic-bezier(.32,.72,0,1); color-scheme:dark;
}
html{touch-action:manipulation}
html,body{background:var(--bg);color:var(--fg)}
body{font-family:var(--body);font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased;min-height:100%;overscroll-behavior-y:none}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer;-webkit-user-select:none;user-select:none;transition:transform .12s var(--ease),background-color .18s,color .18s,border-color .18s,opacity .18s}
button:active{transform:scale(.96)}
:focus-visible{outline:2px solid var(--accent2);outline-offset:2px}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.wrap{max-width:560px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 130px}
.wrap.enter>*{animation:enter .34s var(--ease) both}
.wrap.enter>*:nth-child(2){animation-delay:.03s}.wrap.enter>*:nth-child(3){animation-delay:.06s}.wrap.enter>*:nth-child(4){animation-delay:.09s}.wrap.enter>*:nth-child(n+5){animation-delay:.12s}
@keyframes enter{from{opacity:0;transform:translate3d(0,10px,0)}to{opacity:1;transform:none}}
.pop{animation:pop .36s var(--ease) both}
@keyframes pop{from{opacity:0;transform:translate3d(0,-6px,0) scale(.98)}to{opacity:1;transform:none}}
.wrap section{contain:layout paint}

header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px)}
header .in{max-width:560px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:14px 12px;display:flex;align-items:center;justify-content:space-between;gap:12px}
.hello{display:flex;flex-direction:column;min-width:0}
.hello small{color:var(--dim);font-size:12px}
.hello b{font-family:var(--display);font-weight:700;font-size:22px;letter-spacing:-.02em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hbtns{display:flex;gap:8px;flex:none}
.circ{width:38px;height:38px;border-radius:50%;border:1px solid var(--line2);background:var(--raise);display:grid;place-items:center;font-family:var(--display);font-weight:700;color:var(--accent2);padding:0}
.circ svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.circ[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:#fff}

/* Segmented control with sliding pill */
.seg{position:relative;display:flex;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:3px;gap:2px}
.seg .ind{position:absolute;top:3px;bottom:3px;left:0;width:0;border-radius:999px;background:var(--raise);box-shadow:inset 0 0 0 1px var(--line2);transition:transform .3s var(--ease),width .3s var(--ease);pointer-events:none}
.seg button{position:relative;z-index:1;flex:1;border:0;background:none;padding:7px 10px;border-radius:999px;color:var(--dim);font-size:13px;font-weight:500;white-space:nowrap}
.seg button[aria-pressed="true"]{color:var(--fg)}
.seg button:active{transform:none}
.row{display:flex;align-items:center;gap:10px}
.between{justify-content:space-between}
.stack{display:flex;flex-direction:column;gap:14px}
section{display:flex;flex-direction:column;gap:12px;margin-top:22px}
h2{font-family:var(--display);font-weight:600;font-size:13px;letter-spacing:.08em;text-transform:uppercase;color:var(--dim);margin:0}
.period{margin-top:6px;overflow-x:auto;scrollbar-width:none}
.period::-webkit-scrollbar{display:none}

.hero{padding:20px 18px 18px;border-radius:20px;background:radial-gradient(120% 140% at 100% 0%,color-mix(in srgb,var(--accent) 22%,transparent),transparent 55%),var(--surface);border:1px solid var(--line);display:flex;flex-direction:column;gap:14px}
.hero .label{font-size:12px;color:var(--dim)}
.hero .big{font-family:var(--mono);font-size:clamp(34px,10vw,46px);font-weight:500;letter-spacing:-.04em;line-height:1;transition:color .3s}
.big.pos{color:var(--pos)} .big.neg{color:var(--neg)} .big.blue{color:var(--blue)}
.trio{display:grid;grid-template-columns:repeat(3,1fr);gap:1px;background:var(--line);border-radius:12px;overflow:hidden}
.trio div{background:var(--raise);padding:10px 12px;display:flex;flex-direction:column;gap:2px;min-width:0}
.trio small{font-size:11px;color:var(--dim);text-transform:uppercase;letter-spacing:.06em}
.trio span{font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;transition:color .3s}

.switch{display:flex;align-items:center;gap:10px;font-size:13px;color:var(--dim);background:none;border:0;padding:0}
.switch:active{transform:none}
.track{width:42px;height:26px;border-radius:999px;background:var(--line2);position:relative;transition:background .25s;flex:none}
.track::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:var(--fg);box-shadow:0 1px 3px rgba(0,0,0,.4);transition:transform .28s var(--ease)}
[aria-checked="true"] > .track{background:var(--accent)}
[aria-checked="true"] > .track::after{transform:translateX(16px)}
.switch.blue[aria-checked="true"] > .track{background:var(--blue)}
.switch.blue[aria-checked="true"]{color:var(--blue)}

/* Income */
.rate{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.rate div{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:4px;min-width:0}
.rate small{font-size:11px;color:var(--dim);text-transform:uppercase;letter-spacing:.06em}
.rate span{font-size:17px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pace{display:flex;flex-direction:column;gap:8px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px;font-size:13px;color:var(--dim)}
.bar{height:6px;border-radius:3px;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%;border-radius:3px;transition:width .5s var(--ease)}
.sub{font-size:12px;color:var(--faint)}

.chartbox{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 10px 8px}
.chartbox svg{display:block;width:100%;height:auto}
.chartbox .axis{fill:var(--faint);font-family:var(--mono);font-size:10px;transition:filter .25s}
.chartbox.anim .ln{animation:draw .8s var(--ease) both}
.chartbox.anim .fa{animation:fadein .6s .2s both}
@keyframes draw{from{stroke-dasharray:1;stroke-dashoffset:1}to{stroke-dasharray:1;stroke-dashoffset:0}}
@keyframes fadein{from{opacity:0}}
.legendline{display:flex;gap:14px;font-size:12px;color:var(--dim);padding:0 6px 8px}
.legendline i{display:inline-block;width:8px;height:8px;border-radius:2px;margin-right:6px;vertical-align:middle}

.months{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.mrow{display:grid;grid-template-columns:1fr auto auto;gap:14px;padding:12px 14px;border-top:1px solid var(--line);align-items:center;font-size:14px}
.mrow:first-child{border-top:0}
.mrow.head{font-size:11px;color:var(--faint);text-transform:uppercase;letter-spacing:.06em;padding-block:9px}
.mrow .r{text-align:right;min-width:72px}
.pos{color:var(--pos)} .neg{color:var(--neg)} .blue{color:var(--blue)} .dim{color:var(--dim)}

.tips{display:flex;flex-direction:column;gap:8px}
.tip{display:flex;gap:12px;padding:12px 14px;border-radius:12px;background:var(--surface);border:1px solid var(--line);font-size:14px}
.tip .dot{width:6px;border-radius:3px;flex:none;background:var(--accent)}
.tip.warn .dot{background:var(--warn)} .tip.good .dot{background:var(--pos)}
.tip p{margin:0;color:var(--dim)} .tip b{color:var(--fg);font-weight:600}

.search input{width:100%;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:11px 14px;transition:border-color .2s}
.search input:focus{outline:none;border-color:var(--accent)}
.search input::placeholder{color:var(--faint)}
.list{display:flex;flex-direction:column;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.item{display:grid;grid-template-columns:42px 1fr auto;gap:12px;align-items:center;padding:12px 14px;border:0;border-top:1px solid var(--line);background:none;text-align:left;width:100%}
.item:first-child{border-top:0}
.item:active{transform:none;background:var(--raise)}
.thumb{width:42px;height:42px;border-radius:10px;background:var(--raise);border:1px solid var(--line2);display:grid;place-items:center;font-family:var(--display);font-weight:700;color:var(--accent2);font-size:15px}
.item .t{min-width:0}
.item .t b{display:block;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.item .t small{color:var(--dim);font-size:12px;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.item .v{text-align:right;display:flex;flex-direction:column;align-items:flex-end;gap:2px}
.item .v small{font-size:12px;color:var(--dim)}
.pill{font-size:11px;padding:2px 8px;border-radius:999px;border:1px solid var(--line2);color:var(--dim)}
.pill.old{color:var(--warn);border-color:color-mix(in srgb,var(--warn) 40%,transparent)}
.duo{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.mini{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px;min-width:0}
.mini small{display:block;font-size:11px;color:var(--dim);text-transform:uppercase;letter-spacing:.06em}
.mini span{font-size:20px;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

.empty{padding:34px 20px;text-align:center;color:var(--dim);display:flex;flex-direction:column;gap:12px;align-items:center;background:var(--surface);border:1px dashed var(--line2);border-radius:var(--r)}
.empty b{color:var(--fg);font-family:var(--display);font-size:18px}

.btn{border:0;border-radius:12px;padding:12px 18px;font-weight:600;background:var(--accent);color:#fff}
.btn.ghost{background:var(--raise);color:var(--fg);border:1px solid var(--line2)}
.btn.danger{background:none;color:var(--neg);border:1px solid color-mix(in srgb,var(--neg) 35%,transparent)}
.btn.danger.armed{background:var(--neg);color:#1a0509}
.btn.wide{width:100%}
.btn.sm{padding:9px 14px;font-size:14px}

/* Settings */
.group{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.setrow{display:flex;align-items:center;justify-content:space-between;gap:14px;width:100%;padding:13px 14px;border:0;border-top:1px solid var(--line);background:none;text-align:left;min-height:52px}
.setrow:first-child{border-top:0}
.setrow:active{transform:none;background:var(--raise)}
.setrow .lab{display:flex;flex-direction:column;min-width:0}
.setrow .lab small{color:var(--faint);font-size:12px}
.setrow.col{flex-direction:column;align-items:stretch;gap:10px}
.setrow input[type=text]{background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:9px 12px;min-width:0;width:100%}
.setrow input:focus{outline:none;border-color:var(--accent)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{display:inline-flex;align-items:center;gap:4px;padding:5px 6px 5px 11px;border-radius:999px;background:var(--raise);border:1px solid var(--line2);font-size:13px}
.chip button{border:0;background:none;color:var(--faint);width:22px;height:22px;border-radius:50%;padding:0;line-height:1;font-size:16px}
.addrow{display:flex;gap:8px}
.addrow input{flex:1}

/* Privacy blur */
.m{border-radius:6px;transition:color .22s var(--ease),background-color .22s var(--ease);-webkit-box-decoration-break:clone;box-decoration-break:clone}
body.priv.pb .m-b, body.priv.ps .m-s, body.priv.pp .m-p, body.priv.pw .m-w{color:transparent!important;background-color:color-mix(in srgb,var(--fg) 11%,transparent);-webkit-user-select:none;user-select:none}
.chartbox .axis{transition:opacity .22s}
body.priv.pp .chartbox.c-p .axis, body.priv.ps .chartbox.c-s .axis{opacity:0}

/* Wallet */
.wallet{display:flex;flex-direction:column;gap:12px;padding:16px 18px;border-radius:18px;background:linear-gradient(135deg,color-mix(in srgb,var(--accent) 16%,var(--surface)),var(--surface) 60%);border:1px solid color-mix(in srgb,var(--accent) 30%,var(--line))}
.wallet .wv{font-family:var(--mono);font-size:30px;letter-spacing:-.03em;line-height:1.1}
.wallet .wrow{display:flex;gap:18px;font-size:13px;color:var(--dim);flex-wrap:wrap}
.wallet .wrow b{color:var(--fg);font-weight:500}
.wallet .acts{display:flex;gap:8px}
.wallet .acts .btn{flex:1}
.txrow{display:grid;grid-template-columns:1fr auto auto;gap:10px;align-items:center;padding:10px 0;border-top:1px solid var(--line);font-size:14px}
.txrow:first-child{border-top:0}
.txrow small{display:block;color:var(--faint);font-size:12px}
.txrow button{border:0;background:none;color:var(--faint);font-size:18px;width:30px;height:30px;padding:0}
.banner{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 12px 10px 14px;border-radius:12px;background:color-mix(in srgb,var(--warn) 10%,var(--surface));border:1px solid color-mix(in srgb,var(--warn) 30%,transparent);font-size:13px;color:var(--dim);margin-top:10px}
.banner b{color:var(--fg)}
.inlinesw{display:flex;align-items:center;justify-content:space-between;gap:12px;width:100%;background:none;border:0;padding:4px 0;text-align:left;font-size:14px}
.inlinesw:active{transform:none}
.inlinesw small{display:block;color:var(--faint);font-size:12px}
.pill.pre{color:var(--accent2);border-color:color-mix(in srgb,var(--accent) 45%,transparent)}

/* Tab bar */
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:6;background:color-mix(in srgb,var(--bg) 85%,transparent);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
nav.tabs .in{position:relative;max-width:560px;margin:0 auto;display:grid;grid-template-columns:1fr 1fr 64px 1fr 1fr;align-items:center;padding-left:max(8px,env(safe-area-inset-left,0px));padding-right:max(8px,env(safe-area-inset-right,0px));padding-block:6px}
nav.tabs button{background:none;border:0;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11px;color:var(--faint);padding:6px 0}
nav.tabs button svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;transition:transform .2s var(--ease)}
nav.tabs button[aria-current="page"]{color:var(--fg)}
nav.tabs button[aria-current="page"] svg{transform:translateY(-1px);stroke:var(--accent2)}
.tabind{position:absolute;top:-1px;left:0;width:22px;height:2px;border-radius:2px;background:var(--accent2);transition:transform .38s var(--spring),opacity .2s;pointer-events:none}

/* Quarters */
.qgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.q{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px;display:flex;flex-direction:column;gap:6px;min-width:0;transition:border-color .25s}
.q.best{border-color:color-mix(in srgb,var(--accent) 55%,transparent)}
.q.future{opacity:.5}
.q .qh{display:flex;justify-content:space-between;align-items:center;gap:6px}
.q .qh b{font-family:var(--display);font-size:16px}
.q .qh small{font-size:11px;color:var(--faint)}
.q .qv{font-size:19px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.q .qs{font-size:12px;color:var(--dim)}
.q .bar{height:4px}
.tag{font-size:10px;padding:1px 7px;border-radius:999px;background:var(--raise);border:1px solid var(--line2);color:var(--accent2);text-transform:uppercase;letter-spacing:.06em}

/* Products */
.rank{font-family:var(--mono);font-size:12px;color:var(--faint);width:14px;text-align:center}
.prod{grid-template-columns:14px 42px 1fr auto}
.seemore{background:none;border:0;color:var(--accent2);font-size:13px;font-weight:500;padding:4px 0}
.sugg{display:flex;flex-direction:column;gap:6px;margin-top:2px}
.sugg button{display:flex;justify-content:space-between;gap:10px;align-items:center;text-align:left;background:var(--raise);border:1px solid var(--line2);border-radius:10px;padding:9px 12px;font-size:14px;width:100%}
.sugg button b{font-weight:600;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sugg button small{color:var(--dim);font-size:12px;white-space:nowrap;flex:none}
.sugg .lbl{font-size:11px;color:var(--faint);text-transform:uppercase;letter-spacing:.06em}
.hint{display:flex;align-items:center;justify-content:space-between;gap:10px;font-size:13px;color:var(--dim);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:9px 10px 9px 12px}
.hint b{color:var(--fg)}

nav.tabs .add{width:52px;height:52px;margin:0 auto;border-radius:16px;background:var(--accent);color:#fff;display:grid;place-items:center;box-shadow:0 8px 24px -8px color-mix(in srgb,var(--accent) 80%,transparent)}
nav.tabs .add svg{width:24px;height:24px;stroke-width:2.2}

/* Sheet */
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:20;opacity:0;transition:opacity .22s}
.scrim.on{opacity:1}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:21;background:var(--surface);border-top:1px solid var(--line2);border-radius:22px 22px 0 0;max-height:92%;overflow:auto;transform:translate3d(0,105%,0);transition:transform .42s var(--spring);will-change:transform;padding-bottom:calc(20px + env(safe-area-inset-bottom,0px));overscroll-behavior:contain}
.sheet.on{transform:none}
.sheet.drag{transition:none}
.sheet .in{max-width:560px;margin:0 auto;padding-left:max(18px,env(safe-area-inset-left,0px));padding-right:max(18px,env(safe-area-inset-right,0px));padding-block:0;display:flex;flex-direction:column;gap:14px}
.grabzone{padding-top:10px;touch-action:none;cursor:grab}
.grab{width:38px;height:4px;border-radius:2px;background:var(--line2);margin:0 auto 12px}
.sheet h3{font-family:var(--display);font-weight:700;font-size:22px;margin:0;letter-spacing:-.02em}
.field{display:flex;flex-direction:column;gap:6px;min-width:0}
.field label{font-size:12px;color:var(--dim)}
.field input,.field select{background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:11px 12px;width:100%;min-width:0;font-size:16px;transition:border-color .2s}
.field input:focus,.field select:focus{border-color:var(--accent);outline:none}
.field input.bad{border-color:var(--neg)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.soldbox{display:flex;flex-direction:column;gap:12px;padding:14px;border-radius:14px;border:1px solid var(--line);background:var(--raise)}
.calc{display:flex;justify-content:space-between;font-size:14px;color:var(--dim)}
.toast{position:fixed;left:50%;bottom:calc(92px + env(safe-area-inset-bottom,0px));transform:translate(-50%,16px) scale(.96);opacity:0;background:var(--raise);border:1px solid var(--line2);padding:10px 16px;border-radius:999px;font-size:13px;z-index:30;transition:all .22s var(--ease);pointer-events:none;white-space:nowrap}
.toast.on{opacity:1;transform:translate(-50%,0)}
.note{font-size:12px;color:var(--faint);text-align:center;margin:0}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{transition:none!important;animation:none!important}}
</style>

<script>
(function(){
const $=s=>document.querySelector(s);
const CATS=["Sneakers","Clothing","Streetwear","Electronics","Trading cards","Collectibles","Watches","Bags","Other"];
const DEF_BOUGHT=["Retail","Second Hand","Private Supplier","Wholesale","Online","Car boot","Other"];
const DEF_SOLD=["Marketplace","Snapchat","Privately","Instagram","Vinted","eBay","Depop","Other"];
const MON=["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
const MONL=["January","February","March","April","May","June","July","August","September","October","November","December"];
const DEF_PROFILE={name:"",currency:"£",privacy:false,blur:{b:true,s:false,p:false,w:true},showFees:true,showPostage:true,wallet:false,startCash:0,staleDays:45,defaultPeriod:"year",boughtFrom:DEF_BOUGHT.slice(),soldOn:DEF_SOLD.slice()};

let S={tab:"home",period:"year",soldOnly:false,soldView:"list",prodSort:"profit",qYear:new Date().getFullYear()+"",q:"",items:[],txs:[],parcels:[],profile:JSON.parse(JSON.stringify(DEF_PROFILE))};
let col=null,downloads=null,animChart=true,lastTab=null;

/* ---------- storage ---------- */
const LS="flipbook.v1";
function mergeProfile(p){p=p||{};const d=JSON.parse(JSON.stringify(DEF_PROFILE));const r=Object.assign(d,p);r.blur=Object.assign({},d.blur,p.blur||{});if(!Array.isArray(r.boughtFrom)||!r.boughtFrom.length)r.boughtFrom=d.boughtFrom;if(!Array.isArray(r.soldOn)||!r.soldOn.length)r.soldOn=d.soldOn;return r}
function lsLoad(){try{const d=JSON.parse(localStorage.getItem(LS)||"null");if(d){S.items=d.items||[];S.txs=d.txs||[];S.parcels=d.parcels||[];S.profile=mergeProfile(d.profile)}}catch(e){}}
function lsSave(){try{localStorage.setItem(LS,JSON.stringify({items:S.items,txs:S.txs,parcels:S.parcels,profile:S.profile}))}catch(e){}}
async function saveTx(t){S.txs.push(t);lsSave();render();if(col){try{const r=Object.assign({},t,{kind:"tx"});delete r.id;await col.doc(t.id).set(r)}catch(e){}}}
async function saveParcel(pc,quiet){const i=S.parcels.findIndex(x=>x.id===pc.id);if(i>=0)S.parcels[i]=pc;else S.parcels.push(pc);lsSave();if(!quiet)render();if(col){try{const r=Object.assign({},pc,{kind:"parcel"});delete r.id;for(const k in r)if(r[k]===undefined||r[k]===null)delete r[k];await col.doc(pc.id).set(r)}catch(e){}}}
async function removeParcel(id,quiet){S.parcels=S.parcels.filter(x=>x.id!==id);lsSave();if(!quiet)render();if(col){try{await col.doc(id).delete()}catch(e){}}}
async function removeTx(id,quiet){S.txs=S.txs.filter(t=>t.id!==id);lsSave();if(!quiet)render();if(col){try{await col.doc(id).delete()}catch(e){}}}
function clean(o){const r={};for(const k in o)if(o[k]!==undefined&&o[k]!==null&&o[k]!=="")r[k]=o[k];r.kind="item";return r}
async function saveItem(it,quiet){

async function removeItem(id,quiet){

let pT;
function saveProfile(){
  lsSave(); render();
  clearTimeout(pT);pT=setTimeout(async()=>{if(col){try{await col.doc("profile").set(Object.assign({kind:"profile"},JSON.parse(JSON.stringify(S.profile))))}catch(e){}}},400);

async function connect(){
  try{
    if(!window.claude||!claude.use)return;
    const [d,u]=await Promise.all([claude.use("db"),claude.use("user")]);
    claude.use("downloads").then(x=>{downloads=x;if(S.tab==="settings")render()}).catch(()=>{});
    if(!d||!u)return; const uid=await u.id(); if(!uid)return;
    col=d.collection("data/users/"+uid);
    const snap=await col.get();
    const items=[];let prof=null;
    const txs=[],pcs=[];
    snap.docs.forEach(doc=>{const v=doc.data();if(!v)return;if(v.kind==="profile")prof=v;else if(v.kind==="item")items.push(Object.assign({},v,{id:doc.id}));else if(v.kind==="tx")txs.push(Object.assign({},v,{id:doc.id}));else if(v.kind==="parcel")pcs.push(Object.assign({},v,{id:doc.id}))});
    if(items.length||prof||txs.length||pcs.length){S.items=items;S.txs=txs;S.parcels=pcs;if(prof){delete prof.kind;S.profile=mergeProfile(prof)}lsSave();S.period=S.profile.defaultPeriod||S.period}
    else if(S.items.length||S.profile.name){
      for(const it of S.items){try{await col.doc(it.id).set(clean(it))}catch(e){}}
      for(const pc of S.parcels){await saveParcel(pc,true)}
      for(const t of S.txs){try{const r=Object.assign({},t,{kind:"tx"});delete r.id;await col.doc(t.id).set(r)}catch(e){}}
      saveProfile();
    }
    render(); if(!S.profile.name)openProfile();
  }catch(e){}
}

/* ---------- maths ---------- */
const cur=()=>S.profile.currency||"£";
function money(n,sign){n=+n||0;const a=Math.abs(n);const s=a>=1000?Math.round(a).toLocaleString("en-GB"):a.toLocaleString("en-GB",{minimumFractionDigits:Math.round(a*100)%100?2:0,maximumFractionDigits:2});return (n<-.004?"−":(sign&&n>.004?"+":""))+cur()+s}
const M=(v,k,sign)=>`<span class="m m-${k}">${money(v,sign)}</span>`;
const isSold=it=>!!it.soldDate&&it.soldPrice!=null&&it.soldPrice!=="";
const profitOf=it=>isSold(it)?(+it.soldPrice-(+it.fees||0)-(+it.shipping||0)-(+it.buyPrice||0)):0;
const ym=d=>d?d.slice(0,7):"";
const dayMs=864e5;
const toD=d=>new Date(d+"T12:00:00");
const daysSince=d=>Math.floor((Date.now()-toD(d).getTime())/dayMs);
const iso=x=>x.getFullYear()+"-"+String(x.getMonth()+1).padStart(2,"0")+"-"+String(x.getDate()).padStart(2,"0");
const today=()=>iso(new Date());
const nowYM=()=>today().slice(0,7);
const stale=()=>+S.profile.staleDays||45;

function inPeriod(date){
  if(!date)return false;
  if(S.period==="all")return true;
  if(S.period==="month")return ym(date)===nowYM();
  if(S.period==="year")return date.slice(0,4)===today().slice(0,4);
  if(S.period==="12m"){const d=new Date();d.setMonth(d.getMonth()-11,1);return ym(date)>=iso(d).slice(0,7)}
  return true;
}
function totals(){
  let bought=0,boughtN=0,sold=0,soldN=0,profit=0,fees=0,cost=0;
  for(const it of S.items){
    if(inPeriod(it.buyDate)){bought+=+it.buyPrice||0;boughtN++}
    if(isSold(it)&&inPeriod(it.soldDate)){sold+=+it.soldPrice;soldN++;profit+=profitOf(it);fees+=(+it.fees||0)+(+it.shipping||0);cost+=+it.buyPrice||0}
  }
  return {bought,boughtN,sold,soldN,profit,fees,roi:cost?profit/cost*100:0};
}
function income(){
  const sold=S.items.filter(isSold);if(!sold.length)return null;
  const first=sold.map(i=>i.soldDate).sort()[0];
  const active=Math.max(1,daysSince(first)+1);
  const win=Math.min(Math.max(active,14),180);
  const start=iso(new Date(Date.now()-(win-1)*dayMs));
  let p=0,s=0,n=0;sold.forEach(i=>{if(i.soldDate>=start){p+=profitOf(i);s+=+i.soldPrice;n++}});
  const v=S.soldOnly?s:p;const perDay=v/win;
  const d=new Date();const dim=new Date(d.getFullYear(),d.getMonth()+1,0).getDate();const dom=d.getDate();
  let mp=0,ms=0;sold.forEach(i=>{if(ym(i.soldDate)===nowYM()){mp+=profitOf(i);ms+=+i.soldPrice}});
  const mv=S.soldOnly?ms:mp;
  // last month for comparison
  const lm=new Date(d.getFullYear(),d.getMonth()-1,1);const lmk=iso(lm).slice(0,7);
  let lv=0;sold.forEach(i=>{if(ym(i.soldDate)===lmk)lv+=S.soldOnly?+i.soldPrice:profitOf(i)});
  return {week:perDay*7,month:perDay*30.44,year:perDay*365,win,perWeekItems:n/win*7,soFar:mv,pace:mv/dom*dim,month0:MONL[d.getMonth()],last:lv,lastName:MONL[lm.getMonth()]};
}
function monthKeys(){
  if(S.period==="month")return [nowYM()];
  const keys=[];const d=new Date();let n=12;
  if(S.period==="year")n=d.getMonth()+1;
  if(S.period==="all"){const ds=S.items.flatMap(i=>[i.buyDate,i.soldDate]).filter(Boolean).sort();if(ds.length){const f=toD(ds[0].slice(0,7)+"-01");n=(d.getFullYear()-f.getFullYear())*12+d.getMonth()-f.getMonth()+1}else n=6}
  n=Math.max(n,1);
  for(let i=n-1;i>=0;i--){const x=new Date(d.getFullYear(),d.getMonth()-i,1);keys.push(iso(x).slice(0,7))}
  return keys;
}
function byMonth(keys){
  const m={};keys.forEach(k=>m[k]={bought:0,sold:0,profit:0,n:0});
  for(const it of S.items){
    const b=ym(it.buyDate);if(m[b])m[b].bought+=+it.buyPrice||0;
    if(isSold(it)){const s=ym(it.soldDate);if(m[s]){m[s].sold+=+it.soldPrice;m[s].profit+=profitOf(it);m[s].n++}}
  }
  return m;
}
const norm=s=>String(s||"").toLowerCase().replace(/\s+/g," ").trim();
const mode=a=>{const c={};let b=null,n=0;a.filter(Boolean).forEach(x=>{c[x]=(c[x]||0)+1;if(c[x]>n){n=c[x];b=x}});return b};
function products(){
  const g={};
  S.items.forEach(i=>{const k=norm(i.name);if(!k)return;(g[k]=g[k]||{key:k,items:[]}).items.push(i)});
  return Object.values(g).map(p=>{
    const items=p.items.slice().sort((a,b)=>(b.buyDate||"").localeCompare(a.buyDate||""));
    const sold=items.filter(isSold);const n=sold.length;
    const profit=sold.reduce((a,i)=>a+profitOf(i),0),cost=sold.reduce((a,i)=>a+(+i.buyPrice||0),0);
    const dd=sold.filter(i=>i.buyDate&&!i.preorder).map(i=>Math.max(0,(toD(i.soldDate)-toD(i.buyDate))/dayMs));
    const last=items[0];
    return {key:p.key,name:last.name,category:last.category,size:last.size,lastBuy:+last.buyPrice||0,lastFrom:last.boughtFrom,
      n,count:items.length,inStock:items.length-n,profit,avgProfit:n?profit/n:0,roi:cost?profit/cost*100:null,
      avgDays:dd.length?dd.reduce((a,b)=>a+b,0)/dd.length:null,
      avgSell:n?sold.reduce((a,i)=>a+(+i.soldPrice),0)/n:null,
      avgFees:n?sold.reduce((a,i)=>a+(+i.fees||0),0)/n:0,avgShip:n?sold.reduce((a,i)=>a+(+i.shipping||0),0)/n:0,
      usualOn:mode(sold.map(i=>i.soldOn)),lastSold:sold.map(i=>i.soldDate).sort().pop()||""};
  });
}
const PSORT=[["profit","Most profit"],["fast","Fastest"],["sold","Most sold"],["roi","Best ROI"]];
function rankProducts(list,sort){
  let l=list.filter(p=>p.n>0);
  if(sort==="profit")l.sort((a,b)=>b.profit-a.profit);
  if(sort==="fast"){l=l.filter(p=>p.avgDays!=null);l.sort((a,b)=>a.avgDays-b.avgDays||b.n-a.n)}
  if(sort==="sold")l.sort((a,b)=>b.n-a.n||b.profit-a.profit);
  if(sort==="roi"){l=l.filter(p=>p.roi!=null);l.sort((a,b)=>b.roi-a.roi)}
  return l;
}
const daysTxt=d=>d==null?"–":d<1?"same day":Math.round(d)+(Math.round(d)===1?" day":" days");
function prodRow(p,i,sort){
  const val=sort==="fast"?`<span class="num">${daysTxt(p.avgDays)}</span><small>to sell</small>`
    :sort==="sold"?`<span class="num">${p.n}×</span><small>sold</small>`
    :sort==="roi"?`<span class="num ${p.roi<0?"neg":"pos"}"><span class="m m-p">${Math.round(p.roi)}%</span></span><small>ROI</small>`
    :`<span class="num ${p.profit<0?"neg":"pos"}">${M(p.profit,"p",true)}</span><small>total</small>`;
  const sub=[`Sold ${p.n}×`,p.avgDays!=null&&sort!=="fast"?daysTxt(p.avgDays)+" avg":"",sort!=="profit"&&sort!=="roi"?"":"",p.inStock?p.inStock+" in stock":""].filter(Boolean).join(" · ");
  return `<button class="item prod" id="pr-${encodeURIComponent(p.key).replace(/%/g,"")}" data-prod="${esc(p.key)}"><span class="rank">${i+1}</span><span class="thumb">${esc(initials(p.name))}</span><span class="t"><b>${esc(p.name)}</b><small>${sub}</small></span><span class="v">${val}</span></button>`;
}
function quarters(y){
  const q=[0,1,2,3].map(()=>({p:0,s:0,b:0,n:0}));
  S.items.forEach(i=>{
    if(i.buyDate&&i.buyDate.slice(0,4)===y)q[Math.floor((+i.buyDate.slice(5,7)-1)/3)].b+=+i.buyPrice||0;
    if(isSold(i)&&i.soldDate.slice(0,4)===y){const x=q[Math.floor((+i.soldDate.slice(5,7)-1)/3)];x.p+=profitOf(i);x.s+=+i.soldPrice;x.n++}
  });
  return q;
}
function viewQuarters(){
  const yrs=[...new Set(S.items.flatMap(i=>[i.buyDate,i.soldDate]).filter(Boolean).map(d=>d.slice(0,4)).concat([today().slice(0,4)]))].sort().slice(-4);
  if(!yrs.includes(S.qYear))S.qYear=yrs[yrs.length-1];
  const y=S.qYear,q=quarters(y),k=S.soldOnly?"s":"p";
  const val=x=>S.soldOnly?x.s:x.p;
  const curY=today().slice(0,4),curQ=Math.floor((new Date().getMonth())/3);
  const isFut=i=>y>curY||(y===curY&&i>curQ);
  const maxAbs=Math.max(1,...q.map(x=>Math.abs(val(x))));
  const live=q.map((x,i)=>i).filter(i=>!isFut(i)&&(q[i].n||q[i].b));
  const best=live.length>1?live.reduce((a,b)=>val(q[b])>val(q[a])?b:a):-1;
  const R=["Jan–Mar","Apr–Jun","Jul–Sep","Oct–Dec"];
  const cards=q.map((x,i)=>{
    const fut=isFut(i),v=val(x);
    const prev=i>0?val(q[i-1]):null;
    let ch="";if(!fut&&prev!=null&&(q[i-1].n||q[i-1].b)&&Math.abs(prev)>0.5){const pc=(v-prev)/Math.abs(prev)*100;ch=`<span class="${pc<0?"neg":"pos"}">${pc<0?"↓":"↑"} ${Math.abs(Math.round(pc))}%</span> vs Q${i}`}
    const tag=fut?`<span class="tag" style="color:var(--faint)">Upcoming</span>`:(y===curY&&i===curQ?`<span class="tag">Now</span>`:(i===best?`<span class="tag" style="color:var(--pos)">Best</span>`:`<small>${R[i]}</small>`));
    const cls=S.soldOnly?"blue":(v<0?"neg":(v>0?"pos":""));
    return `<div class="q${fut?" future":""}${i===best?" best":""}">
      <div class="qh"><b>Q${i+1}</b>${tag}</div>
      <span class="qv num ${fut?"dim":cls}">${fut?"–":cnt("q"+i,v,S.soldOnly?"m":"p",k)}</span>
      <div class="bar"><i style="width:${fut?0:(Math.abs(v)/maxAbs*100).toFixed(1)}%;background:${S.soldOnly?"var(--blue)":(v<0?"var(--neg)":"var(--pos)")}"></i></div>
      <span class="qs">${fut?R[i]:`${x.n} sold · bought ${M(x.b,"b")}`}</span>
      ${ch?`<span class="qs">${ch}</span>`:""}
    </div>`}).join("");
  const tot=q.reduce((a,x)=>a+val(x),0);
  return `<section><div class="row between"><h2>Quarters</h2>${yrs.length>1?seg("qy",yrs.map(v=>[v,v]),y,"Year"):`<span class="sub">${y}</span>`}</div>
  <div class="qgrid">${cards}</div>
  <p class="note">${y} total: <span class="num ${S.soldOnly?"blue":(tot<0?"neg":"pos")}">${S.soldOnly?M(tot,"s"):M(tot,"p",true)}</span></p></section>`;
}
function viewProducts(limit){
  const ranked=rankProducts(products(),S.prodSort);
  const list=limit?ranked.slice(0,limit):ranked;
  const body=list.length?`<div class="list">${list.map((p,i)=>prodRow(p,i,S.prodSort)).join("")}</div>`:`<div class="empty"><b>No sales to rank yet</b><span>Once you sell something, your best products show here.</span></div>`;
  return `<div class="period">${seg("ps",PSORT,S.prodSort,"Rank by")}</div>${body}
  ${limit&&ranked.length>limit?`<button class="seemore" data-act="allprod">See all ${ranked.length} products →</button>`:(list.length?`<p class="note">Tap a product to add it again with its usual details.</p>`:"")}`;

const fmtDate=d=>{if(!d)return"";const [y,m,dd]=d.split("-");return +dd+" "+MON[+m-1]+(y!==today().slice(0,4)?" "+y:"")};
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const initials=s=>(s||"?").trim().split(/\s+/).slice(0,2).map(w=>w[0]).join("").toUpperCase();

/* ---------- chart ---------- */
function chart(keys,m){
  const W=340,H=170,L=38,R=8,T=10,B=24,iw=W-L-R,ih=H-T-B;
  const main=keys.map(k=>S.soldOnly?m[k].sold:m[k].profit);
  const sec=keys.map(k=>S.soldOnly?0:m[k].sold);
  let max=Math.max(1,...main,...sec),min=Math.min(0,...main);
  const step=niceStep((max-min)/3);max=Math.ceil(max/step)*step;min=Math.floor(min/step)*step;
  const y=v=>T+ih-(v-min)/(max-min)*ih;
  const x=i=>keys.length===1?L+iw/2:L+i*iw/(keys.length-1);
  let g="";
  for(let v=min;v<=max+1e-9;v+=step){g+=`<line x1="${L}" x2="${W-R}" y1="${y(v).toFixed(1)}" y2="${y(v).toFixed(1)}" stroke="var(--line)" stroke-width="1" ${v===0?'':'stroke-dasharray="2 4"'}/><text class="axis" x="${L-6}" y="${(y(v)+3).toFixed(1)}" text-anchor="end">${short(v)}</text>`}
  const every=Math.ceil(keys.length/6);
  keys.forEach((k,i)=>{if(i%every===0||i===keys.length-1)g+=`<text class="axis" x="${x(i).toFixed(1)}" y="${H-6}" text-anchor="middle">${MON[+k.slice(5)-1]}</text>`});
  const c=S.soldOnly?"var(--blue)":"var(--pos)";
  const path=a=>a.map((v,i)=>(i?"L":"M")+x(i).toFixed(1)+" "+y(v).toFixed(1)).join(" ");
  let body="";
  if(keys.length===1){
    const v=main[0];body+=`<rect class="fa" x="${x(0)-30}" y="${Math.min(y(v),y(0)).toFixed(1)}" width="60" height="${Math.abs(y(v)-y(0)).toFixed(1)}" rx="6" fill="${c}"/>`;
  }else{
    if(!S.soldOnly)body+=`<path class="ln" pathLength="1" d="${path(sec)}" fill="none" stroke="var(--accent)" stroke-width="1.5" opacity=".75"/>`;
    const base=y(Math.max(min,0)).toFixed(1);
    body+=`<path class="fa" d="${path(main)} L${x(keys.length-1).toFixed(1)} ${base} L${x(0).toFixed(1)} ${base} Z" fill="url(#fillg)"/>`;
    body+=`<path class="ln" pathLength="1" d="${path(main)}" fill="none" stroke="${c}" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round"/>`;
    const li=keys.length-1;body+=`<circle class="fa" cx="${x(li).toFixed(1)}" cy="${y(main[li]).toFixed(1)}" r="4.5" fill="var(--bg)" stroke="${c}" stroke-width="2"/>`;
  }
  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${S.soldOnly?"Money sold":"Profit"} by month"><defs><linearGradient id="fillg" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="${c}" stop-opacity=".32"/><stop offset="1" stop-color="${c}" stop-opacity="0"/></linearGradient></defs>${g}${body}</svg>`;
}
function niceStep(r){if(r<=0)return 1;const p=Math.pow(10,Math.floor(Math.log10(r)));const f=r/p;return (f<=1?1:f<=2?2:f<=5?5:10)*p}
function short(v){const a=Math.abs(v);return (v<0?"−":"")+(a>=1000?(a/1000).toFixed(a%1000?1:0)+"k":a.toFixed(0))}

/* ---------- views ---------- */
function seg(name,opts,val,label){return `<div class="seg" role="group" aria-label="${label}"><span class="ind"></span>${opts.map(([k,l])=>`<button data-${name}="${k}" aria-pressed="${val===k}">${l}</button>`).join("")}</div>`}
const PERIODS=[["month","This month"],["year","This year"],["12m","12 months"],["all","All time"]];
const periodBar=()=>`<div class="period">${seg("period",PERIODS,S.period,"Period")}</div>`;
const periodName=()=>({month:"this month",year:"this year","12m":"last 12 months",all:"all time"}[S.period]);
const soldSwitch=()=>`<button class="switch blue" id="soldSwitch" role="switch" aria-checked="${S.soldOnly}"><span>Sold only</span><span class="track"></span></button>`;
const cnt=(key,v,f,k)=>`<span class="m m-${k} cnt" data-key="${key}" data-v="${v}" data-f="${f}">${fmt(v,f)}</span>`;
function fmt(v,f){return f==="p"?money(v,true):f==="m"?money(v):f==="%"?Math.round(v)+"%":String(Math.round(v))}

function walletCalc(){
  const P=S.profile;let cash=(+P.startCash||0),stock=0,inn=0,out=0;
  S.txs.forEach(t=>{cash+=+t.amount||0;if(t.amount>0)inn+=+t.amount;else out-=+t.amount});
  S.items.forEach(i=>{cash-=+i.buyPrice||0;if(isSold(i))cash+=(+i.soldPrice)-(+i.fees||0)-(+i.shipping||0);else stock+=+i.buyPrice||0});
  return {cash,stock,total:cash+stock,inn,out};
}
function viewWallet(){
  if(!S.profile.wallet)return "";
  const w=walletCalc();
  return `<section><div class="wallet">
    <div class="row between"><h2>Wallet</h2><span class="sub">cash on hand</span></div>
    <div class="wv ${w.cash<0?"neg":""}">${cnt("wal",w.cash,"m","w")}</div>
    <div class="wrow"><span>Stock <b class="num">${M(w.stock,"w")}</b></span><span>Total capital <b class="num">${M(w.total,"w")}</b></span></div>
    <div class="acts"><button class="btn sm ghost" data-act="txin">Add</button><button class="btn sm ghost" data-act="txout">Withdraw</button><button class="btn sm ghost" data-act="txlog" style="flex:0 0 auto">History</button></div>
  </div></section>`;
}
const parcelOf=it=>it.parcelId?S.parcels.find(x=>x.id===it.parcelId):null;
function preInfo(it){const pc=parcelOf(it);return pc?{eta:pc.eta||"",delivered:!!pc.delivered,deliveredDate:pc.deliveredDate||"",parcel:pc}:{eta:it.eta||"",delivered:!!it.delivered,deliveredDate:it.deliveredDate||"",parcel:null}}
function parcelItems(id){return S.items.filter(i=>i.parcelId===id&&isSold(i))}
function parcelSum(pc){const its=parcelItems(pc.id);return {its,val:its.reduce((a,i)=>a+(+i.soldPrice),0),profit:its.reduce((a,i)=>a+profitOf(i),0)}}
const openParcels=()=>S.parcels.filter(x=>!x.delivered).sort((a,b)=>(a.eta||"9").localeCompare(b.eta||"9"));
function preStats(){
  const pre=S.items.filter(i=>isSold(i)&&i.preorder);if(!pre.length)return null;
  const pi=new Map(pre.map(i=>[i,preInfo(i)]));
  const open=pre.filter(i=>!pi.get(i).delivered).sort((a,b)=>(pi.get(a).eta||"9").localeCompare(pi.get(b).eta||"9"));
  const done=pre.filter(i=>pi.get(i).delivered);
  const lead=done.filter(i=>pi.get(i).deliveredDate).map(i=>Math.max(0,(toD(pi.get(i).deliveredDate)-toD(i.soldDate))/dayMs));

function tips(){
  const out=[];const stock=S.items.filter(i=>!isSold(i));const sold=S.items.filter(isSold);
  const old=stock.filter(i=>i.buyDate&&daysSince(i.buyDate)>stale());
  if(old.length){const v=old.reduce((a,i)=>a+(+i.buyPrice||0),0);out.push(["warn",`<b>${old.length} item${old.length>1?"s":""} sitting ${stale()}+ days</b> with ${M(v,"b")} tied up. A small price drop or relist usually gets them moving.`])}
  if(sold.length>=2){
    const byCat={};sold.forEach(i=>{const c=i.category||"Other";byCat[c]=byCat[c]||{p:0,n:0};byCat[c].p+=profitOf(i);byCat[c].n++});
    const best=Object.entries(byCat).sort((a,b)=>b[1].p/b[1].n-a[1].p/a[1].n)[0];
    out.push(["good",`<b>${esc(best[0])}</b> earns you the most per flip, ${M(best[1].p/best[1].n,"p")} on average.`]);
    const byPlat={};sold.forEach(i=>{const c=i.soldOn||"Other";byPlat[c]=byPlat[c]||{p:0,n:0};byPlat[c].p+=profitOf(i);byPlat[c].n++});
    const bp=Object.entries(byPlat).sort((a,b)=>b[1].n-a[1].n)[0];
    out.push(["",`Most of your sales go through <b>${esc(bp[0])}</b> (${bp[1].n} of ${sold.length}).`]);
    const days=sold.filter(i=>i.buyDate&&!i.preorder).map(i=>Math.max(0,(toD(i.soldDate)-toD(i.buyDate))/dayMs));
    if(days.length)out.push(["",`Items in stock take <b>${Math.round(days.reduce((a,b)=>a+b,0)/days.length)} days</b> to sell on average. Pre-orders aren't counted.`]);
    const losers=sold.filter(i=>profitOf(i)<0);if(losers.length)out.push(["warn",`<b>${losers.length} sale${losers.length>1?"s":""} at a loss.</b> Check fees and postage before pricing.`]);
  }
  if(!out.length)out.push(["",`Log a few sales and this fills with insights on your best categories and how fast things sell.`]);
  return out.map(([c,h])=>`<div class="tip ${c}"><span class="dot"></span><p>${h}</p></div>`).join("");
}

/* ---------- smooth DOM patching ---------- */
function sameNode(a,b){return a.nodeType===b.nodeType&&a.nodeName===b.nodeName&&(a.id||"")===(b.id||"")}
function patchEl(a,b){
  if(a.nodeType===3||a.nodeType===8){if(a.nodeValue!==b.nodeValue)a.nodeValue=b.nodeValue;return}
  if(a.classList&&a.classList.contains("ind"))return;
  for(const at of [...a.attributes])if(!b.hasAttribute(at.name))a.removeAttribute(at.name);
  for(const at of [...b.attributes])if(a.getAttribute(at.name)!==at.value)a.setAttribute(at.name,at.value);
  if(a.tagName==="INPUT"){if(a!==document.activeElement&&a.value!==(b.getAttribute("value")||""))a.value=b.getAttribute("value")||"";return}
  patchKids(a,b);
}
function patchKids(a,b){
  const bk=[...b.childNodes];const keyed={};
  for(const n of a.childNodes)if(n.id)keyed[n.id]=n;
  bk.forEach((n,i)=>{
    const cur=a.childNodes[i];let m=n.id?keyed[n.id]:cur;
    if(m&&sameNode(m,n)){if(n.id)delete keyed[n.id];if(m!==cur)a.insertBefore(m,cur||null);patchEl(m,n)}
    else{if(n.id&&n.classList&&n.classList.contains("item"))n.classList.add("pop");a.insertBefore(n,cur||null)}
  });
  while(a.childNodes.length>bk.length)a.lastChild.remove();
}
const prevV={};
function runCounters(){
  document.querySelectorAll(".cnt").forEach(el=>{
    const key=el.dataset.key,v=+el.dataset.v,f=el.dataset.f,from=prevV[key];prevV[key]=v;
    if(from==null||from===v||matchMedia("(prefers-reduced-motion: reduce)").matches)return;
    const t0=performance.now(),dur=420;
    cancelAnimationFrame(el._raf);
    const step=now=>{const p=Math.min(1,(now-t0)/dur),e=1-Math.pow(1-p,3);el.textContent=fmt(from+(v-from)*e,f);if(p<1)el._raf=requestAnimationFrame(step)};
    el._raf=requestAnimationFrame(step);
  });
}
function placeInds(instant){
  document.querySelectorAll(".seg").forEach(s=>{
    const ind=s.querySelector(".ind"),on=s.querySelector('button[aria-pressed="true"]');if(!ind)return;

function bindDrag(){
  const z=$("#grabzone"),sh=$("#sheet");let y0=null,dy=0;

  const d=new Date();const ds=(mAgo,day)=>{const x=new Date(d.getFullYear(),d.getMonth()-mAgo,Math.min(day,28));if(x>d)x.setTime(d.getTime());return iso(x)};
  const SO=[["Nike Dunk Low Panda","Sneakers","UK 9",72,11,4,"Retail",128,9,3,8.5,4.5,"Marketplace"],["Carhartt WIP Detroit jacket","Clothing","M",35,10,2,"Second Hand",95,10,20,0,6,"Vinted"],["Pokémon 151 booster box","Trading cards","Sealed",120,9,8,"Retail",175,8,2,0,0,"Snapchat"],["Stüssy 8 Ball hoodie","Streetwear","L",40,8,15,"Private Supplier",78,7,12,0,4,"Instagram"],["New Balance 550 White Green","Sneakers","UK 8",60,7,6,"Retail",54,6,1,5.4,6,"eBay"],["AirPods Pro 2","Electronics","Sealed",159,6,20,"Wholesale",205,5,9,0,0,"Privately"],["Arc'teryx Beta LT","Clothing","S",90,5,3,"Second Hand",230,4,14,11.5,6,"Vinted"],["Jordan 4 Military Black","Sneakers","UK 10",190,4,10,"Retail",255,3,4,0,0,"Snapchat"],["Ralph Lauren knit","Clothing","M",8,3,5,"Car boot",38,2,9,0,3.5,"Vinted"],["Casio G-Shock GA-2100","Watches","",55,2,7,"Online",82,1,18,8.2,4,"eBay"],["Asics Gel-1130 Silver","Sneakers","UK 9",95,1,12,"Retail",148,0,5,0,0,"Privately"],["Nike Dunk Low Panda","Sneakers","UK 7",72,7,2,"Retail",120,7,6,0,0,"Snapchat"],["Nike Dunk Low Panda","Sneakers","UK 10",75,3,8,"Retail",135,3,10,0,0,"Snapchat"],["Pokémon 151 booster box","Trading cards","Sealed",120,4,1,"Wholesale",168,3,20,0,0,"Marketplace"],["Ralph Lauren knit","Clothing","L",6,1,3,"Car boot",35,1,14,0,3.5,"Vinted"]];
  const ST=[["Supreme box logo tee","Streetwear","L",48,3,2,"Private Supplier"],["Nintendo Switch OLED","Electronics","Used, boxed",160,2,22,"Second Hand"],["Salomon XT-6","Sneakers","UK 8.5",110,0,3,"Retail"],["Vintage Levi's 501","Clothing","W32",12,1,6,"Car boot"]];
  const items=[];
  SO.forEach((r,i)=>items.push({id:"ex"+i,example:true,name:r[0],category:r[1],size:r[2],buyPrice:r[3],buyDate:ds(r[4],r[5]),boughtFrom:r[6],soldPrice:r[7],soldDate:ds(r[8],r[9]),fees:r[10],shipping:r[11],soldOn:r[12]}));
  ST.forEach((r,i)=>items.push({id:"exs"+i,example:true,name:r[0],category:r[1],size:r[2],buyPrice:r[3],buyDate:ds(r[4],r[5]),boughtFrom:r[6]}));
  items.forEach(it=>saveItem(it,true));animChart=true;render();toast("Example data loaded");
}
function exportCSV(){
  const cols=["name","category","size","buyPrice","buyDate","boughtFrom","soldPrice","soldDate","fees","shipping","soldOn","profit"];
  const q=v=>{v=v==null?"":String(v);return /[",\n]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v};
  const rows=[cols.join(",")].concat(S.items.map(i=>cols.map(c=>q(c==="profit"?(isSold(i)?profitOf(i).toFixed(2):""):i[c])).join(",")));
  saveFile("flipbook-"+today()+".csv",rows.join("\n"),"text/csv");
}
function saveFile(name,data,type){
  if(downloads){downloads.save({filename:name,data}).then(r=>{if(r&&r.status==="saved")toast("Saved "+name)}).catch(()=>toast("Save didn't go through"));return}
  try{const u=URL.createObjectURL(new Blob([data],{type}));const a=document.createElement("a");a.href=u;a.download=name;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),4000);toast("Saved "+name)}catch(e){toast("Saving files isn't available here")}
}
function backup(){saveFile("flipbook-backup-"+today()+".json",JSON.stringify({app:"flipbook",version:1,saved:new Date().toISOString(),profile:S.profile,items:S.items,txs:S.txs,parcels:S.parcels}),"application/json")}
let pendingRestore=null;
function restoreFrom(d){
  S.items.slice().forEach(i=>removeItem(i.id,true));S.txs.slice().forEach(t=>removeTx(t.id,true));S.parcels.slice().forEach(x=>removeParcel(x.id,true));
  S.profile=mergeProfile(d.profile);(d.parcels||[]).forEach(x=>saveParcel(x,true));(d.items||[]).forEach(i=>saveItem(i,true));(d.txs||[]).forEach(t=>saveTx(t));
  saveProfile();render();toast(`Restored ${(d.items||[]).length} items`);
}

/* ---------- events ---------- */
let tt;function toast(m){const t=$("#toast");t.textContent=m;t.classList.add("on");clearTimeout(tt);tt=setTimeout(()=>t.classList.remove("on"),1800)}
let wipeArmed=false;
document.addEventListener("click",e=>{
  const b=e.target.closest("button");if(!b||b.closest("#sheet"))return;
  const P=S.profile,ds=b.dataset;
  if(b.id!=="wipeBtn"&&wipeArmed){wipeArmed=false}
  if(ds.tab){if(S.tab===ds.tab){window.scrollTo({top:0,behavior:"smooth"});return}S.tab=ds.tab;S.q="";window.scrollTo(0,0);render();return}
  if(ds.period){if(S.period===ds.period)return;S.period=ds.period;animChart=true;render();return}
  if(ds.sv){if(S.soldView===ds.sv)return;S.soldView=ds.sv;S.q="";render();return}
  if(ds.qy){S.qYear=ds.qy;render();return}
  if(ds.ps){if(S.prodSort===ds.ps)return;S.prodSort=ds.ps;render();return}
  if(ds.prod){openItem(null,ds.prod);return}
  if(ds.act==="allpre"){S.tab="sold";S.soldView="pre";S.q="";window.scrollTo(0,0);render();return}
  if(ds.act==="newparcel"){openParcel(null);return}
  if(ds.parcel){openParcel(ds.parcel);return}
  if(ds.act==="allprod"){S.tab="sold";S.soldView="products";S.q="";window.scrollTo(0,0);render();return}
  if(b.id==="soldSwitch"||ds.set==="soldOnly"){S.soldOnly=!S.soldOnly;animChart=true;try{localStorage.setItem("flipbook.soldOnly",S.soldOnly?"1":"")}catch(_){}render();return}
  if(ds.set==="wallet"||ds.set==="showFees"||ds.set==="showPostage"){P[ds.set]=!P[ds.set];saveProfile();return}
  if(ds.act==="txin"||ds.act==="txout"){openTx(ds.act==="txin");return}
  if(ds.act==="txlog"){openTxLog();return}
  if(ds.set==="privacy"||b.id==="eyeBtn"){P.privacy=!P.privacy;saveProfile();if(b.id==="eyeBtn")toast(P.privacy?"Privacy on":"Privacy off");return}
  if(ds.blur){P.blur[ds.blur]=!P.blur[ds.blur];saveProfile();return}
  if(ds.cur){P.currency=ds.cur;saveProfile();return}
  if(ds.defp){P.defaultPeriod=ds.defp;S.period=ds.defp;saveProfile();return}
  if(ds.stale){P.staleDays=+ds.stale;saveProfile();return}
  if(ds.rm){const [k,i]=ds.rm.split("|");if(P[k].length<=1){toast("Keep at least one option");return}P[k].splice(+i,1);saveProfile();return}
  if(ds.addlist){addOpt(ds.addlist);return}
  if(ds.id){openItem(ds.id);return}
  if(b.id==="addBtn"||ds.act==="add"){openItem(null);return}
  if(ds.act==="sample"){loadSample();return}
  if(ds.act==="clearEx"){S.items.filter(i=>i.example).forEach(i=>removeItem(i.id,true));render();toast("Example data removed");return}
  if(ds.act==="export"){exportCSV();return}
  if(ds.act==="backup"){backup();return}
  if(ds.act==="dorestore"&&pendingRestore){const d=pendingRestore;pendingRestore=null;restoreFrom(d);return}
  if(ds.act==="wipe"){if(!wipeArmed){wipeArmed=true;b.classList.add("armed");b.textContent="Tap again to delete everything";return}wipeArmed=false;S.items.slice().forEach(i=>removeItem(i.id,true));S.txs.slice().forEach(t=>removeTx(t.id,true));S.parcels.slice().forEach(x=>removeParcel(x.id,true));render();toast("All items deleted");return}
  if(b.id==="avatarBtn"){if(S.tab!=="settings"){S.tab="settings";window.scrollTo(0,0);render()}return}
});
function addOpt(k){const inp=$("#add_"+k);const v=(inp.value||"").trim();if(!v)return;if(S.profile[k].some(x=>x.toLowerCase()===v.toLowerCase())){toast("Already in the list");return}S.profile[k].push(v);inp.value="";saveProfile()}
document.addEventListener("keydown",e=>{
  if(e.key==="Escape"&&!mustName)closeSheet();
  if(e.key==="Enter"&&e.target.id&&e.target.id.startsWith("add_")){e.preventDefault();addOpt(e.target.id.slice(4))}
  if(e.key==="Enter"&&e.target.id==="s_name")e.target.blur();
});
document.addEventListener("touchstart",()=>{},{passive:true});
let qRaf=0;
document.addEventListener("input",e=>{if(e.target.id==="q"){S.q=e.target.value;cancelAnimationFrame(qRaf);qRaf=requestAnimationFrame(render)}if(e.target.classList.contains("bad"))e.target.classList.remove("bad")});
document.addEventListener("change",e=>{if(e.target.id!=="restoreFile"||!e.target.files[0])return;const f=e.target.files[0];e.target.value="";f.text().then(t=>{let d;try{d=JSON.parse(t)}catch(_){toast("That file isn't a Flipbook backup");return}if(!d||d.app!=="flipbook"||!Array.isArray(d.items)){toast("That file isn't a Flipbook backup");return}
  pendingRestore=d;openSheet("Restore backup",`<p style="margin:0;color:var(--dim)">This backup has <b style="color:var(--fg)">${d.items.length} items</b>, ${(d.parcels||[]).length} parcels and ${(d.txs||[]).length} wallet entries, saved ${esc((d.saved||"").slice(0,10))}. It replaces everything currently in the app.</p><button class="btn wide" id="doRestore">Replace with backup</button><button class="btn ghost wide" id="cancelRestore">Cancel</button>`);
  $("#doRestore").onclick=()=>{closeSheet();const x=pendingRestore;pendingRestore=null;setTimeout(()=>restoreFrom(x),150)};$("#cancelRestore").onclick=()=>{pendingRestore=null;closeSheet()}})});
document.addEventListener("change",e=>{if(e.target.id==="s_start"){const v=parseFloat(String(e.target.value).replace(/[^0-9.\-]/g,""))||0;S.profile.startCash=v;saveProfile();toast("Starting cash saved")}});
document.addEventListener("change",e=>{if(e.target.id==="s_name"){const v=e.target.value.trim();if(v&&v!==S.profile.name){S.profile.name=v;saveProfile();toast("Username saved")}}});
window.addEventListener("resize",()=>{placeInds(true);placeTab(true)});

lsLoad();try{S.soldOnly=localStorage.getItem("flipbook.soldOnly")==="1"}catch(e){}
S.period=S.profile.defaultPeriod||"year";
render();
if(document.fonts&&document.fonts.ready)document.fonts.ready.then(()=>{placeInds(true);placeTab(true)});
connect();
setTimeout(()=>{if(!col&&!S.profile.name&&!$("#sheet").classList.contains("on"))openProfile()},1500);
})();
</script>

</body></html>
